version: 2
updates:
  # Dockerfiles: FROM lines (tag + digest). ARG-pinned versions (RUNNER_VERSION,
  # COSIGN_VERSION, VAULT_VERSION) are not tracked by Dependabot — RUNNER_VERSION is
  # checked by .github/workflows/runner-version.yml.
  - package-ecosystem: docker
    directories: [/, /controller, /deployer, /tests]
    schedule:
      interval: weekly

  # docker-compose.yml (tecnativa/docker-socket-proxy digest). The `docker` ecosystem
  # only reads Dockerfiles; compose files need their own ecosystem.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # GitHub Actions in .github/workflows (SHA-pinned `uses:`). Tool images referenced in
  # `run:` steps (shellcheck, hadolint, actionlint, zizmor, trivy) are pinned by digest
  # and must be bumped manually.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
